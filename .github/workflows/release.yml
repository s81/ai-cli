name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Least privilege: only the final release job can write to the repository.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ai-cli-linux-x86_64
            binary: build/ai-cli
            strip: strip build/ai-cli

          - os: macos-latest
            artifact: ai-cli-macos-universal
            binary: build/ai-cli
            strip: strip build/ai-cli

          - os: windows-latest
            artifact: ai-cli-windows-x86_64.exe
            binary: build/Release/ai-cli.exe
            strip: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure
        shell: bash
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config Release

      - name: Strip (Unix)
        if: matrix.strip != ''
        shell: bash
        run: ${{ matrix.strip }}

      - name: Rename artifact
        shell: bash
        run: cp ${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload assets

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          for f in */*; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # passed via env, never interpolated into the script: a tag name
          # may contain shell metacharacters such as $( )
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "ai-cli $TAG" \
            --generate-notes \
            dist/ai-cli-linux-x86_64/ai-cli-linux-x86_64 \
            dist/ai-cli-macos-universal/ai-cli-macos-universal \
            dist/ai-cli-windows-x86_64.exe/ai-cli-windows-x86_64.exe \
            dist/SHA256SUMS.txt

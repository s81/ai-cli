name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ai-cli-linux-x86_64
            binary: build/ai-cli
            strip: strip build/ai-cli

          - os: macos-latest
            artifact: ai-cli-macos-universal
            binary: build/ai-cli
            strip: strip build/ai-cli

          - os: windows-latest
            artifact: ai-cli-windows-x86_64.exe
            binary: build/Release/ai-cli.exe
            strip: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure
        shell: bash
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Strip (Unix)
        if: matrix.strip != ''
        shell: bash
        run: ${{ matrix.strip }}

      - name: Rename artifact
        shell: bash
        run: cp ${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            --title "ai-cli $TAG" \
            --generate-notes \
            dist/ai-cli-linux-x86_64/ai-cli-linux-x86_64 \
            dist/ai-cli-macos-universal/ai-cli-macos-universal \
            dist/ai-cli-windows-x86_64.exe/ai-cli-windows-x86_64.exe
